<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 3D Limbo (the original 2D page is games/limbo-classic.html: viewer.html?limbo=classic). Plays the host's game state (SYNC_STATE) or ?demo=1; with neither, the look-dev loop. -->
    <title>Limbo</title>
    <link rel="stylesheet" href="/games/event-videos.css">
    <script src="/games/shared-player-theme.js"></script>
    <link rel="stylesheet" href="/games/dart-callout.css">
    <script src="/games/dart-callout.js"></script>
    <script src="/games/dart-announcer.js"></script>
    <script src="/games/event-videos.js"></script>
    <script type="importmap">{ "imports": { "three": "/vendor/three-0.160.0/three.module.min.js" } }</script>
    <style>
        :root { font-size: calc(100vh / 108); --coral: #ff8a5c; --ink: #fff3e2; --cond: "Avenir Next Condensed", "DIN Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #070914; color: var(--ink); font-family: var(--cond); }
        #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .lb-loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: linear-gradient(180deg, #0a1030 0%, #2a1840 55%, #b8553a 100%); transition: opacity 1.2s ease .2s; }
        .lb-loader h1 { margin: 0; font: italic 900 12rem/0.9 var(--cond); letter-spacing: 0.02em; text-transform: uppercase; color: #fff3e2; text-shadow: 0 0 4rem rgba(255, 138, 92, 0.7); }
        .lb-loader i { display: block; height: 0.8rem; margin-top: 2.4rem; background: linear-gradient(90deg, transparent, var(--coral), #ffd27a, var(--coral), transparent); background-size: 200% 100%; animation: flick 1.4s linear infinite; }
        @keyframes flick { to { background-position: -200% 0; } }
        body.booted .lb-loader { opacity: 0; pointer-events: none; }
        body.capture .lb-loader { display: none; }
        body.no-webgl .lb-loader h1::after { content: ' — 3D unavailable'; font-size: 3rem; }

        /* ---------------------------------------------------------- HUD: carved wood, cream type, neon team edge */
        .lb-hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .6s; }
        body.live .lb-hud { opacity: 1; }
        .lb-plaque, .lb-thrower, .lb-pcard, .lb-help {
            background: linear-gradient(180deg, rgba(74, 46, 26, 0.94), rgba(38, 22, 12, 0.95)),
                repeating-linear-gradient(90deg, rgba(255, 220, 170, 0.04) 0 0.3rem, transparent 0.3rem 1.1rem);
            box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 230, 190, 0.18), inset 0 -0.4rem 0 rgba(0, 0, 0, 0.25);
            color: var(--ink);
        }
        .lb-plaque { position: absolute; top: 3rem; left: 3rem; width: 17rem; padding: 1.1rem 0 1.4rem; text-align: center; border-radius: 1.2rem; border: 0.3rem solid #d9a44a; }
        .lb-plaque-label { font: 800 1.6rem var(--cond); letter-spacing: 0.4em; color: #f3c46a; padding-left: 0.4em; }
        .lb-plaque-num { font: 900 9.5rem/0.95 var(--cond); font-variant-numeric: tabular-nums; color: #fff3e2; text-shadow: 0 0 2.4rem rgba(255, 138, 60, 0.75), 0 0.4rem 0 rgba(0, 0, 0, 0.45); }
        .lb-plaque.tick .lb-plaque-num { animation: ratchet .12s ease-out; }
        .lb-plaque.is-hot { border-color: #ff7a2a; box-shadow: 0 0 3rem rgba(255, 110, 30, 0.55), 0 1.2rem 3rem rgba(0, 0, 0, 0.5); }
        .lb-plaque.is-hot .lb-plaque-num { color: #ffd9a8; }
        @keyframes ratchet { from { transform: translateY(0.6rem); } }

        .lb-thrower { position: absolute; top: 3rem; left: 50%; display: flex; align-items: center; gap: 2rem; min-width: 60rem; max-width: 86rem; padding: 1.4rem 2.2rem 1.4rem 1.6rem; border-radius: 1.2rem; transform: translate(-50%, -150%); transition: transform .55s cubic-bezier(.2, .9, .3, 1.25); border-bottom: 0.45rem solid var(--team, #ff8a5c); box-shadow: 0 0 2.6rem color-mix(in srgb, var(--team, #ff8a5c) 45%, transparent), 0 1.2rem 3rem rgba(0, 0, 0, 0.5); }
        .lb-thrower.is-on { transform: translate(-50%, 0); }
        .lb-tav { flex: none; }
        .lb-tav-in, .lb-pav { display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--team, #ff8a5c) 80%, #fff), color-mix(in srgb, var(--team, #ff8a5c) 60%, #000)); border: 0.35rem solid #e0ad55; color: #fff; font: 900 3.4rem var(--cond); }
        .lb-tav-in { width: 9.4rem; height: 9.4rem; }
        .lb-tav-in img, .lb-pav img { width: 100%; height: 100%; object-fit: cover; }
        .lb-tmid { flex: 1; min-width: 0; }
        .lb-label { font: 800 1.3rem var(--cond); letter-spacing: 0.4em; text-transform: uppercase; color: #f3c46a; }
        .lb-tname { font: 900 4.6rem/1 var(--cond); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0.2rem 0 0.1rem; }
        .lb-tteam { font: 700 1.7rem var(--cond); letter-spacing: 0.12em; text-transform: uppercase; color: #d9c4a2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lb-darts { display: flex; gap: 0.8rem; margin-top: 0.8rem; }
        .lb-pip { min-width: 7.6rem; height: 3.6rem; padding: 0 0.8rem; display: grid; place-items: center; font: 900 2.2rem var(--cond); border-radius: 0.6rem; border: 2px solid rgba(255, 230, 190, 0.18); color: transparent; background: rgba(0, 0, 0, 0.18); }
        .lb-pip.is-thrown { color: #fff; border-color: var(--team); background: color-mix(in srgb, var(--team) 34%, rgba(0, 0, 0, 0.3)); animation: pip .35s cubic-bezier(.2, 1.6, .4, 1); }
        .lb-pip.is-miss { color: #ffb08a; border-color: #ff6a3a; background: rgba(255, 90, 40, 0.18); font-size: 1.7rem; }
        @keyframes pip { from { transform: scale(1.5); filter: brightness(2.5); } }
        .lb-room { margin-top: 0.8rem; font: 800 1.9rem var(--cond); letter-spacing: 0.14em; text-transform: uppercase; color: #ffe6c2; min-height: 2.2rem; }
        .lb-room.is-tight { color: #ff9a5a; text-shadow: 0 0 1.4rem rgba(255, 110, 40, 0.8); }
        .lb-total { flex: none; text-align: center; padding-left: 1.6rem; border-left: 2px solid rgba(255, 230, 190, 0.15); }
        .lb-total-num { font: 900 6.6rem/1 var(--cond); font-variant-numeric: tabular-nums; color: var(--team, #fff); text-shadow: 0 0 2rem color-mix(in srgb, var(--team, #fff) 50%, transparent); }
        .lb-total-label { font: 800 1.3rem var(--cond); letter-spacing: 0.4em; color: #f3c46a; }

        .lb-strip { position: absolute; left: 3rem; right: 3rem; bottom: 3rem; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 1.2rem; }
        .lb-pcard { position: relative; display: flex; align-items: center; gap: 1.2rem; padding: 1.1rem 1.4rem; border-radius: 1rem; border-top: 0.45rem solid var(--team); transition: transform .45s cubic-bezier(.2, .9, .3, 1.3), box-shadow .45s, filter .6s, opacity .6s; overflow: hidden; }
        .lb-pav { flex: none; width: 5.4rem; height: 5.4rem; font-size: 2.2rem; border-width: 0.25rem; }
        .lb-pname { flex: 1; min-width: 0; font: 800 2.3rem var(--cond); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lb-flames { flex: none; display: flex; gap: 0.5rem; }
        .lb-flames i { width: 1.9rem; height: 2.8rem; border-radius: 50% 50% 45% 45% / 62% 62% 38% 38%; background: radial-gradient(ellipse at 50% 78%, #fff6c8 0 18%, #ffb238 34%, #ff5a14 62%, rgba(180, 30, 0, 0) 74%); filter: drop-shadow(0 0 0.7rem rgba(255, 120, 30, 0.9)); animation: flick 1.1s ease-in-out infinite alternate; transform-origin: 50% 100%; transition: opacity .5s, filter .5s; }
        .lb-flames i:nth-child(2) { animation-delay: -.4s; } .lb-flames i:nth-child(3) { animation-delay: -.75s; }
        .lb-flames i.is-out { animation: none; background: radial-gradient(ellipse at 50% 80%, #3a2a20 0 30%, rgba(0, 0, 0, 0) 60%); filter: none; opacity: 0.6; }
        @keyframes flick { from { transform: scaleY(0.88) skewX(-3deg); } to { transform: scaleY(1.06) skewX(3deg); } }
        .lb-pcard.is-active { transform: translateY(-1.4rem); box-shadow: 0 0 0 2px var(--team), 0 0 3.6rem color-mix(in srgb, var(--team) 55%, transparent), 0 1.2rem 3rem rgba(0, 0, 0, 0.5); }
        .lb-pcard.is-out { filter: grayscale(1) brightness(0.55); }
        .lb-pcard.is-out::after { content: 'OUT'; position: absolute; right: 1.2rem; top: 0.6rem; font: 900 1.6rem var(--cond); letter-spacing: 0.3em; color: #ff8a5c; }

        .lb-title { position: absolute; left: 0; right: 0; top: 35%; text-align: center; opacity: 0; transform: scale(2.6); filter: blur(1.4rem); }
        .lb-title.is-on { animation: slam .42s cubic-bezier(.2, 1.4, .3, 1) forwards; }
        .lb-title.is-out { animation: titleOut .35s ease-in forwards; }
        @keyframes slam { 0% { opacity: 0; transform: scale(2.6) rotate(-4deg); filter: blur(1.4rem); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: scale(1) rotate(-2deg); filter: blur(0); } }
        @keyframes titleOut { from { opacity: 1; transform: scale(1) rotate(-2deg); } to { opacity: 0; transform: scale(0.9) translateY(-2rem); } }
        .lb-title-main { font: italic 900 14rem/0.9 var(--cond); text-transform: uppercase; letter-spacing: 0.01em; color: #fff3e2; text-shadow: 0 0 4rem color-mix(in srgb, var(--team) 75%, transparent), 0 0.7rem 0 rgba(40, 18, 6, 0.85); -webkit-text-stroke: 0.25rem var(--team); }
        .lb-title-sub { display: inline-block; margin-top: 1.6rem; padding: 0.6rem 2.6rem; font: 900 2.8rem var(--cond); letter-spacing: 0.26em; text-transform: uppercase; color: #2a1408; background: linear-gradient(180deg, #ffd27a, #e0a440); border-radius: 0.6rem; box-shadow: 0 0.5rem 0 rgba(60, 28, 8, 0.7); }
        .lb-title.k-burn .lb-title-main, .lb-title.k-out .lb-title-main { color: #ffb070; -webkit-text-stroke: 0.25rem #ff3a10; text-shadow: 0 0 5rem rgba(255, 80, 10, 0.95), 0 0.7rem 0 rgba(40, 10, 0, 0.9); }
        .lb-title.k-reset .lb-title-main { font-size: 9rem; }
        .lb-title.k-winner { top: 22%; }
        .lb-title.k-winner .lb-title-main { font-size: 12rem; }
        .lb-hud.is-winner .lb-thrower { transform: translate(-50%, -150%); }

        .lb-help { position: absolute; left: 50%; top: 50%; width: 76rem; padding: 3rem 3.6rem; border-radius: 1.6rem; border: 0.3rem solid #d9a44a; transform: translate(-50%, -50%) scale(0.9); opacity: 0; transition: opacity .3s, transform .3s; }
        .lb-help.is-on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .lb-help h2 { margin: 0 0 1.8rem; font: italic 900 5rem var(--cond); text-transform: uppercase; color: #ffd27a; }
        .lb-help-row { display: grid; grid-template-columns: 22rem 1fr; gap: 1.6rem; padding: 1rem 0; border-top: 1px solid rgba(255, 230, 190, 0.14); font: 600 2.3rem/1.3 var(--cond); }
        .lb-help-row b { font-weight: 900; text-transform: uppercase; color: #ffb36a; }
        .lb-sound { position: fixed; right: 2.4rem; bottom: 2.4rem; z-index: 60; padding: 0.9rem 1.8rem; border-radius: 99rem; font: 800 1.8rem var(--cond); letter-spacing: 0.08em; color: #2a1408; background: linear-gradient(180deg, #ffd27a, #e0a440); box-shadow: 0 0.6rem 2rem rgba(0, 0, 0, 0.45); opacity: 0; transform: translateY(1rem); transition: opacity .4s, transform .4s; pointer-events: none; }
        .lb-sound.is-on { opacity: 1; transform: none; }
        body.capture .lb-sound { display: none; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div class="lb-loader"><div><h1>Limbo</h1><i></i></div></div>
    <script type="module" src="/games/limbo/main.js"></script>
</body>
</html>
