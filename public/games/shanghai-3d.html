<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 3D Shanghai ("The Lantern Pagoda"). Milestone 1: plays the real game (viewer.html?shanghai=3d) and ?demo=1.
         Becomes games/shanghai.html at Milestone 4. ?lookdev=… is the Milestone 0 look-dev page. -->
    <title>Shanghai</title>
    <script src="/games/shared-player-theme.js"></script>
    <script src="/games/dart-callout.js"></script>
    <script src="/games/dart-announcer.js"></script>
    <script src="/games/event-videos.js"></script>
    <script type="importmap">{ "imports": { "three": "/vendor/three-0.160.0/three.module.min.js" } }</script>
    <style>
        :root { font-size: calc(100vh / 108); --sh3-gold: #e8b54c; --sh3-paper: #f1e6c8; --sh3-paper2: #e2d0a2; --sh3-red: #a3161b; --sh3-ink: #20140c; --sh3-cond: "Avenir Next Condensed", "DIN Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a1a; color: var(--sh3-paper); font-family: var(--sh3-cond); }
        #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .sh3-loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: radial-gradient(ellipse at 50% 60%, #3a1a2a, #0b0a1a 70%); transition: opacity 1s ease .2s; }
        .sh3-loader h1 { margin: 0; font: 900 11rem/0.9 var(--sh3-cond); letter-spacing: 0.04em; text-transform: uppercase; color: var(--sh3-gold); text-shadow: 0 0.6rem 0 #5c0d10; }
        body.booted .sh3-loader { opacity: 0; pointer-events: none; }
        body.no-webgl .sh3-loader h1::after { content: ' — 3D unavailable'; font-size: 3rem; }

        .sh3-hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
        /* scroll paper: cream card, dark lacquer rollers top and bottom, team colour down the side */
        .sh3-round, .sh3-thrower, .sh3-col { background: linear-gradient(180deg, var(--sh3-paper), var(--sh3-paper2)); color: var(--sh3-ink); box-shadow: 0 1rem 2.6rem rgba(0, 0, 0, 0.5); border-radius: 0.5rem; border-top: 0.7rem solid #3a1a10; border-bottom: 0.7rem solid #3a1a10; }

        .sh3-round { position: absolute; top: 2.6rem; left: 3rem; display: flex; align-items: stretch; gap: 1.6rem; padding: 0.8rem 1.6rem; }
        .sh3-round-l { display: grid; align-content: center; }
        .sh3-round-label, .sh3-aim-label { font: 800 1.5rem var(--sh3-cond); letter-spacing: 0.3em; color: var(--sh3-red); }
        .sh3-round-of { font: 900 3.4rem/1 var(--sh3-cond); }
        .sh3-round-of span { font-size: 2.2rem; opacity: .6; }
        .sh3-aim { display: grid; justify-items: center; align-content: center; padding: 0.2rem 1.6rem; background: var(--sh3-red); color: #ffe7a6; border-radius: 0.4rem; }
        .sh3-aim-label { color: #ffe7a6; font-size: 1.3rem; }
        .sh3-aim-num { font: 900 6.4rem/0.9 var(--sh3-cond); text-shadow: 0 0 1.6rem rgba(255, 200, 90, .55); }
        .sh3-round.is-final .sh3-aim { animation: sh3Pulse 0.9s ease-in-out infinite alternate; }
        @keyframes sh3Pulse { to { transform: scale(1.06); filter: brightness(1.2); } }

        /* top left beside the round pill: the top right is the pagoda's (the round tracker must stay clear) */
        .sh3-thrower { position: absolute; top: 2.6rem; left: 29rem; width: 38rem; padding: 0.9rem 1.8rem 1.1rem; transform: translateY(-160%); transition: transform .5s cubic-bezier(.2, .9, .3, 1.2); border-left: 1rem solid var(--team, var(--sh3-gold)); text-align: center; }
        .sh3-thrower.is-on { transform: translateY(0); }
        .sh3-label { font: 800 1.4rem var(--sh3-cond); letter-spacing: 0.4em; color: var(--sh3-red); }
        .sh3-tname { font: 900 3.6rem/1 var(--sh3-cond); text-transform: uppercase; margin: 0.3rem 0 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sh3-tteam { font: 700 1.6rem var(--sh3-cond); letter-spacing: 0.1em; text-transform: uppercase; color: #6a5530; margin-bottom: 0.4rem; }
        .sh3-pips { display: flex; gap: 0.6rem; justify-content: center; margin-top: 0.6rem; }
        .sh3-pip { flex: 1; min-width: 0; height: 3.6rem; display: grid; place-items: center; padding: 0 0.4rem; font: 800 1.9rem var(--sh3-cond); white-space: nowrap; overflow: hidden; border: 0.2rem dashed #b49b6a; border-radius: 0.4rem; color: transparent; }
        .sh3-pip.is-thrown { color: #fff; border-style: solid; animation: sh3Pip .35s cubic-bezier(.2, 1.6, .4, 1); }
        .sh3-pip.is-hit { background: #b8871e; border-color: #b8871e; }
        .sh3-pip.is-zero { background: #5d5248; border-color: #5d5248; }
        @keyframes sh3Pip { from { transform: scale(1.5); filter: brightness(2); } }

        .sh3-cols { position: absolute; left: 3rem; right: 3rem; bottom: 2.4rem; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 1.2rem; }
        .sh3-col { position: relative; padding: 1.1rem 1.3rem 0.9rem; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "av name score" "cells cells cells" "dots dots dots"; column-gap: 1rem; row-gap: 0.5rem; align-items: center; transition: transform .45s cubic-bezier(.2, .9, .3, 1.3), box-shadow .45s; }
        .sh3-col.is-active { transform: translateY(-1.2rem); box-shadow: 0 0 0 0.4rem var(--team), 0 1.4rem 3.2rem rgba(0, 0, 0, 0.55); }
        .sh3-col-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0.7rem; background: var(--team); }
        .sh3-avs { grid-area: av; display: flex; }
        .sh3-avs.is-duo .sh3-av + .sh3-av { margin-left: -1.6rem; }
        .sh3-av { width: 4.8rem; height: 4.8rem; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--team); color: #fff; font: 900 2rem var(--sh3-cond); border: 0.3rem solid #fff8e8; }
        .sh3-av img { width: 100%; height: 100%; object-fit: cover; }
        .sh3-col-name { grid-area: name; font: 800 2.2rem/1.1 var(--sh3-cond); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .sh3-score { grid-area: score; font: 900 5.2rem/1 var(--sh3-cond); color: var(--sh3-red); min-width: 4.6rem; text-align: right; font-variant-numeric: tabular-nums; }
        .sh3-score.bump-up { animation: sh3Bump .6s cubic-bezier(.2, 1.6, .4, 1); }
        @keyframes sh3Bump { from { transform: scale(1.5); color: #b8871e; } }
        .sh3-cells { grid-area: cells; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0.3rem; }
        .sh3-cells i { font: 800 1.6rem/2.4rem var(--sh3-cond); font-style: normal; text-align: center; height: 2.4rem; border-radius: 0.3rem; background: rgba(60, 30, 10, 0.08); color: var(--sh3-ink); font-variant-numeric: tabular-nums; overflow: hidden; }
        .sh3-cells i.is-scored { background: rgba(184, 135, 30, 0.28); }
        .sh3-cells i.is-cur { outline: 0.2rem solid var(--sh3-red); }
        .sh3-dots { grid-area: dots; display: flex; gap: 0.6rem; justify-content: center; height: 1.1rem; }
        .sh3-dots i { width: 1.1rem; height: 1.1rem; border-radius: 50%; background: #cdbb92; opacity: 0; }
        .sh3-col.is-active .sh3-dots i { opacity: 1; }
        .sh3-dots i.is-on { background: var(--team); box-shadow: 0 0 0.6rem var(--team); }

        /* title cards: a scroll that unrolls; a safe zone in the upper middle, above the board */
        .sh3-title { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scaleY(0.2); opacity: 0; padding: 1.4rem 5rem 1.8rem; text-align: center; background: linear-gradient(180deg, var(--sh3-paper), var(--sh3-paper2)); color: var(--sh3-ink); border-radius: 0.6rem; box-shadow: 0 1.6rem 4rem rgba(0, 0, 0, 0.55); border-top: 1rem solid #3a1a10; border-bottom: 1rem solid #3a1a10; border-left: 0.6rem solid var(--team, var(--sh3-gold)); border-right: 0.6rem solid var(--team, var(--sh3-gold)); transition: opacity .2s; max-width: 92vw; }
        .sh3-title.is-on { opacity: 1; animation: sh3Unroll .45s cubic-bezier(.2, 1.3, .4, 1) forwards; }
        .sh3-title.is-out { opacity: 0; transition: opacity .35s; }
        @keyframes sh3Unroll { from { transform: translate(-50%, -50%) scaleY(0.15); } to { transform: translate(-50%, -50%) scaleY(1); } }
        .sh3-title-main { font: 900 8.6rem/0.95 var(--sh3-cond); text-transform: uppercase; letter-spacing: 0.02em; color: var(--team, var(--sh3-red)); }
        .sh3-title-sub { margin-top: 0.8rem; font: 800 2.6rem var(--sh3-cond); letter-spacing: 0.12em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sh3-title.k-winner .sh3-title-sub, .sh3-title.k-draw .sh3-title-sub { font-size: 4.4rem; letter-spacing: 0.04em; }
        .sh3-title.k-shanghai .sh3-title-main, .sh3-title.k-winner .sh3-title-main { color: var(--sh3-red); }

        .sh3-help { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 74rem; padding: 3rem 4rem; background: linear-gradient(180deg, var(--sh3-paper), var(--sh3-paper2)); color: var(--sh3-ink); border-radius: 1rem; box-shadow: 0 2rem 5rem rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; z-index: 6; }
        .sh3-help.is-on { opacity: 1; }
        .sh3-help h2 { margin: 0 0 1.6rem; font: 900 5rem var(--sh3-cond); text-transform: uppercase; color: var(--sh3-red); }
        .sh3-help-row { display: grid; grid-template-columns: 16rem 1fr; gap: 1.6rem; font: 600 2.4rem/1.3 var(--sh3-cond); padding: 0.5rem 0; border-top: 0.15rem dashed #c8b48a; }
        .sh3-help-row b { font-weight: 900; text-transform: uppercase; }

        .sh3-video { position: fixed; inset: 0; z-index: 30; display: none; background: #000; }
        .sh3-video.is-on { display: block; }
        .sh3-video video { width: 100%; height: 100%; object-fit: cover; }
        body.capture .sh3-hud * { animation-duration: 0s !important; transition: none !important; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div class="sh3-loader"><h1>The Lantern Pagoda</h1></div>
    <script type="module">
        // ?lookdev=… is the Milestone 0 look-dev page; otherwise the game
        const q = new URLSearchParams(location.search);
        if (q.has('lookdev')) { document.querySelector('.sh3-loader').remove(); import('/games/shanghai/lookdev.js'); }
        else import('/games/shanghai/main.js');
    </script>
</body>
</html>
