<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 3D Killer, "The Ledger" (the original 2D page is games/killer-classic.html: viewer.html?killer=classic). Plays the host's game state (SYNC_STATE) or ?demo=1. -->
    <title>Killer</title>
    <link rel="stylesheet" href="/games/event-videos.css">
    <script src="/games/shared-player-theme.js"></script>
    <link rel="stylesheet" href="/games/dart-callout.css">
    <script src="/games/dart-callout.js"></script>
    <script src="/games/dart-announcer.js"></script>
    <script src="/games/event-videos.js"></script>
    <script type="importmap">{ "imports": { "three": "/vendor/three-0.160.0/three.module.min.js" } }</script>
    <style>
        :root {
            font-size: calc(100vh / 108);
            --gold: #c9a35a; --gold-hi: #f3d79a; --ink: #f4ead8; --crimson: #ff1f3a; --lacquer: rgba(8, 7, 9, 0.9);
            --cond: "Avenir Next Condensed", "DIN Condensed", "Roboto Condensed", "Arial Narrow", Arial, sans-serif;
            --serif: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", "Times New Roman", serif;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #040405; color: var(--ink); font-family: var(--cond); }
        #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .kl-loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 50; background: radial-gradient(ellipse at 50% 40%, #1a1214 0%, #050405 70%); transition: opacity 1.2s ease .2s; }
        .kl-loader h1 { margin: 0; font: 400 13rem/0.9 var(--serif); letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold-hi); text-shadow: 0 0 3rem rgba(201, 163, 90, 0.45); }
        .kl-loader i { display: block; height: 2px; margin-top: 2.4rem; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
        body.booted .kl-loader { opacity: 0; pointer-events: none; }
        body.capture .kl-loader { display: none; }
        body.no-webgl .kl-loader h1::after { content: ' — 3D unavailable'; font-size: 3rem; }

        /* ---------------------------------------------------------- HUD: black lacquer, gold rules */
        .kl-hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .6s; }
        body.live .kl-hud { opacity: 1; }
        .kl-rounds, .kl-thrower, .kl-pcard, .kl-help {
            background: linear-gradient(180deg, rgba(20, 17, 18, 0.93), var(--lacquer));
            border: 1px solid rgba(201, 163, 90, 0.55);
            box-shadow: 0 1.2rem 3rem rgba(0, 0, 0, 0.55), inset 0 0 0 0.35rem rgba(0, 0, 0, 0.5), inset 0 0 0 calc(0.35rem + 1px) rgba(201, 163, 90, 0.25);
            color: var(--ink);
        }
        .kl-label { font: 700 1.25rem var(--cond); letter-spacing: 0.42em; text-transform: uppercase; color: var(--gold); }

        .kl-rounds { position: absolute; top: 3rem; left: 3rem; padding: 1.3rem 1.8rem 1.4rem; }
        .kl-rrow { display: flex; align-items: center; gap: 1.6rem; margin-top: 0.6rem; }
        .kl-rnum { font: 400 6.4rem/0.9 var(--serif); color: var(--gold-hi); min-width: 5.2rem; text-align: center; font-variant-numeric: lining-nums; }
        .kl-rgroups { display: flex; gap: 1.2rem; }
        .kl-rgroup { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; padding: 0 0.2rem; }
        .kl-rgroup + .kl-rgroup { border-left: 1px solid rgba(201, 163, 90, 0.3); padding-left: 1.2rem; }
        .kl-rpips { display: flex; gap: 0.45rem; }
        .kl-rpips i { width: 1.3rem; height: 1.3rem; transform: rotate(45deg); border: 1px solid rgba(201, 163, 90, 0.6); }
        .kl-rpips i.is-done { background: rgba(201, 163, 90, 0.45); }
        .kl-rpips i.is-now { background: var(--gold-hi); box-shadow: 0 0 1.2rem var(--gold-hi); }
        .kl-rtag { font: 800 1.4rem var(--cond); letter-spacing: 0.2em; color: rgba(244, 234, 216, 0.6); }
        .kl-hud[data-heat="2"] .kl-rgroup:nth-child(2) .kl-rtag { color: #ffb24a; }
        .kl-hud[data-heat="3"] .kl-rgroup:nth-child(3) .kl-rtag, .kl-hud[data-heat="3"] .kl-rnum { color: var(--crimson); text-shadow: 0 0 1.4rem rgba(255, 31, 58, 0.6); }
        .kl-hud[data-heat="3"] .kl-rpips i.is-now { background: var(--crimson); box-shadow: 0 0 1.2rem var(--crimson); }

        .kl-thrower { position: absolute; top: 3rem; left: 50%; display: flex; align-items: center; gap: 2rem; min-width: 64rem; max-width: 92rem; padding: 1.4rem 2rem 1.4rem 1.6rem; transform: translate(-50%, -160%); transition: transform .6s cubic-bezier(.2, .9, .3, 1.15); border-bottom: 0.35rem solid var(--team, var(--gold)); }
        .kl-thrower.is-on { transform: translate(-50%, 0); }
        .kl-thrower.is-killer { border-bottom-color: var(--crimson); box-shadow: 0 0 3rem rgba(255, 31, 58, 0.35), 0 1.2rem 3rem rgba(0, 0, 0, 0.55); }
        .kl-tav { flex: none; }
        .kl-tav-in, .kl-pav { display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--team, #c9a35a) 75%, #fff), color-mix(in srgb, var(--team, #c9a35a) 55%, #000)); border: 0.25rem solid var(--gold); color: #fff; font: 900 3.2rem var(--cond); }
        .kl-tav-in { width: 9rem; height: 9rem; }
        .kl-tav-in img, .kl-pav img { width: 100%; height: 100%; object-fit: cover; }
        .kl-tmid { flex: 1; min-width: 0; }
        .kl-tname { font: 400 4.8rem/1.05 var(--serif); text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0.2rem 0 0; }
        .kl-tteam { font: 700 1.6rem var(--cond); letter-spacing: 0.14em; text-transform: uppercase; color: #c8b896; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kl-darts { display: flex; gap: 0.7rem; margin-top: 0.8rem; }
        .kl-pip { min-width: 10rem; height: 3.4rem; padding: 0 1rem; display: grid; place-items: center; font: 800 1.75rem var(--cond); letter-spacing: 0.06em; border: 1px solid rgba(201, 163, 90, 0.35); color: transparent; background: rgba(0, 0, 0, 0.3); white-space: nowrap; }
        .kl-pip.is-thrown { color: var(--ink); border-color: rgba(201, 163, 90, 0.7); animation: pip .35s cubic-bezier(.2, 1.6, .4, 1); }
        .kl-pip.is-mark { color: #fff; border-color: var(--team); background: color-mix(in srgb, var(--team) 35%, rgba(0, 0, 0, 0.3)); }
        .kl-pip.is-strike { color: #fff; border-color: var(--crimson); background: rgba(255, 31, 58, 0.28); }
        .kl-pip.is-miss { color: #9c907c; }
        @keyframes pip { from { transform: scale(1.4); filter: brightness(2.2); } }
        .kl-tright { flex: none; display: flex; flex-direction: column; align-items: center; gap: 0.7rem; padding-left: 1.8rem; border-left: 1px solid rgba(201, 163, 90, 0.3); }
        .kl-roundel { width: 7.4rem; height: 7.4rem; border-radius: 50%; display: grid; place-items: center; font: 400 4.2rem/1 var(--serif); color: #1a1208; background: radial-gradient(circle at 40% 30%, #fff1c8, #d3a24c 55%, #7c5520); box-shadow: 0 0 0 0.25rem #0a0807, 0 0 0 0.4rem var(--gold), 0 0 2rem rgba(255, 199, 106, 0.35); }
        .kl-thrower.is-killer .kl-roundel { background: radial-gradient(circle at 40% 30%, #ffd0d4, #e0283c 55%, #5a0710); color: #fff; }
        .kl-tstatus { font: 800 1.45rem var(--cond); letter-spacing: 0.22em; color: var(--gold-hi); white-space: nowrap; }
        .kl-thrower.is-killer .kl-tstatus { color: #ff7d8a; }

        .kl-strip { position: absolute; left: 3rem; right: 3rem; bottom: 2.6rem; display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 1.1rem; }
        .kl-pcard { position: relative; display: flex; align-items: center; gap: 1.1rem; padding: 0.9rem 1.2rem; border-top: 0.3rem solid var(--team); transition: transform .45s cubic-bezier(.2, .9, .3, 1.3), box-shadow .45s, filter .6s; overflow: hidden; }
        .kl-pav { flex: none; width: 5rem; height: 5rem; font-size: 2rem; border-width: 0.2rem; }
        .kl-pmid { flex: 1; min-width: 0; }
        .kl-pname { font: 800 2.1rem var(--cond); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kl-segs { display: flex; align-items: center; gap: 0.45rem; margin-top: 0.4rem; }
        .kl-segs i { width: 2.6rem; height: 0.9rem; border: 1px solid color-mix(in srgb, var(--team) 70%, #000); background: rgba(0, 0, 0, 0.4); transition: background .3s, box-shadow .3s; }
        .kl-segs i.is-on { background: var(--team); box-shadow: 0 0 0.9rem var(--team); }
        .kl-ktag { margin-left: 0.6rem; font: 900 1.2rem var(--cond); letter-spacing: 0.24em; color: var(--crimson); opacity: 0; }
        .kl-pcard.is-killer .kl-ktag { opacity: 1; }
        .kl-pcard.is-killer .kl-segs i.is-on { background: linear-gradient(90deg, #ff6a3a, var(--crimson)); box-shadow: 0 0 0.9rem var(--crimson); border-color: #7a0a14; }
        .kl-pnum { flex: none; font: 400 3.8rem/1 var(--serif); color: var(--gold-hi); min-width: 4.4rem; text-align: right; }
        .kl-pcard.is-killer .kl-pnum { color: var(--crimson); }
        .kl-pcard.is-active { transform: translateY(-1.2rem); box-shadow: 0 0 0 1px var(--team), 0 0 3rem color-mix(in srgb, var(--team) 45%, transparent), 0 1.2rem 3rem rgba(0, 0, 0, 0.55); }
        .kl-pcard.is-out { filter: grayscale(1) brightness(0.5); }
        .kl-pcard.is-out::after { content: ''; position: absolute; left: 0.8rem; right: 0.8rem; top: 50%; height: 0.3rem; background: var(--crimson); box-shadow: 0 0 1rem var(--crimson); transform: rotate(-4deg); filter: none; }

        .kl-title { position: absolute; left: 0; right: 0; top: 33%; text-align: center; opacity: 0; }
        .kl-title.is-on { animation: klIn .5s cubic-bezier(.2, 1.2, .3, 1) forwards; }
        .kl-title.is-out { animation: klOut .4s ease-in forwards; }
        @keyframes klIn { 0% { opacity: 0; transform: scale(1.5); letter-spacing: 0.5em; filter: blur(1rem); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
        @keyframes klOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-1.6rem); } }
        .kl-title-main { font: 400 13rem/0.95 var(--serif); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); text-shadow: 0 0 3rem color-mix(in srgb, var(--team, #c9a35a) 70%, transparent), 0 0.6rem 2rem rgba(0, 0, 0, 0.8); }
        .kl-title-sub { display: inline-block; margin-top: 1.4rem; padding: 0.7rem 2.6rem; font: 800 2.6rem var(--cond); letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink); background: rgba(6, 5, 6, 0.86); border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); max-width: 80vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kl-title.k-killer .kl-title-main, .kl-title.k-death .kl-title-main { color: #fff0f0; text-shadow: 0 0 4rem rgba(255, 31, 58, 0.9), 0 0.6rem 2rem rgba(0, 0, 0, 0.8); }
        .kl-title.k-death .kl-title-sub { border-color: var(--crimson); }
        .kl-title.k-stripped .kl-title-main { color: #c9d0d8; }
        .kl-title.k-boost .kl-title-main, .kl-title.k-knock .kl-title-main, .kl-title.k-round .kl-title-main, .kl-title.k-next .kl-title-main { font-size: 9rem; }
        .kl-title.k-round { top: 30%; }
        .kl-title.k-winner, .kl-title.k-draw { top: 20%; }
        .kl-title.k-winner .kl-title-sub, .kl-title.k-draw .kl-title-sub { font-size: 3.6rem; }
        .kl-title[data-why].k-winner::after, .kl-title[data-why].k-draw::after { content: attr(data-why); display: block; margin-top: 1.2rem; font: 700 1.8rem var(--cond); letter-spacing: 0.5em; color: var(--gold); }
        .kl-hud.is-winner .kl-thrower { transform: translate(-50%, -160%); }

        .kl-help { position: absolute; left: 50%; top: 50%; width: 82rem; padding: 3rem 3.6rem; transform: translate(-50%, -50%) scale(0.92); opacity: 0; transition: opacity .3s, transform .3s; z-index: 6; }
        .kl-help.is-on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .kl-help h2 { margin: 0 0 1.6rem; font: 400 5rem var(--serif); text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-hi); }
        .kl-help-row { display: grid; grid-template-columns: 20rem 1fr; gap: 1.6rem; padding: 1rem 0; border-top: 1px solid rgba(201, 163, 90, 0.25); font: 600 2.2rem/1.3 var(--cond); }
        .kl-help-row b { font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); }

        /* the venue's clips in video mode, over the scene (event-videos.js drives the <video>) */
        .kl-video { position: fixed; right: 4rem; top: 50%; width: 64rem; aspect-ratio: 16 / 9; transform: translateY(-50%) scale(0.94); opacity: 0; transition: opacity .35s, transform .35s; z-index: 5; border: 1px solid var(--gold); box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.7); background: #000; pointer-events: none; }
        .kl-video.is-on { opacity: 1; transform: translateY(-50%) scale(1); }
        .kl-video video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .kl-video.video-off { display: none; }
    </style>
</head>
<body>
    <canvas id="stage"></canvas>
    <div class="kl-loader"><div><h1>Killer</h1><i></i></div></div>
    <script type="module" src="/games/killer/main.js"></script>
</body>
</html>
